<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Solo Mahjong</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="game-container">

        <!-- =========================
             HEADER
        ========================== -->
        <header class="game-header">

            <div class="game-title">
                <h1>SOLO MAHJONG</h1>
                <p>1인용 마작 퍼즐</p>
            </div>

            <div class="game-info">

                <div class="info-box">
                    <span class="info-label">SCORE</span>
                    <span id="score" class="info-value">0</span>
                </div>

                <div class="info-box">
                    <span class="info-label">TURNS LEFT</span>
                    <span id="turns-left" class="info-value">15</span>
                </div>

            </div>

        </header>


        <!-- =========================
             GAME BOARD
        ========================== -->
        <main class="game-board">

            <!-- =========================
                 DORA AREA
            ========================== -->
            <section class="dora-section">

                <div class="section-title">
                    <span>DORA</span>
                    <span id="dora-count">1 / 5</span>
                </div>

                <div id="dora-indicators" class="dora-indicators">

                    <!-- 깡을 하면 아래에 도라 표시패가 추가됨 -->

                </div>

            </section>


            <!-- =========================
                 GAME STATUS
            ========================== -->
            <section class="status-section">

                <div id="game-status" class="game-status">
                    패를 선택하여 버려주세요.
                </div>

            </section>


            <!-- =========================
                 PLAYER HAND
            ========================== -->
    <section class="hand-section">

        <div class="section-title">
            <span>YOUR HAND</span>
            <span id="hand-count">13</span>
        </div>

        <!-- 공개된 깡 -->
        <div id="kan-melds" class="kan-melds"></div>

        <!-- 실제 손패 -->
        <div id="player-hand" class="player-hand"></div>

            </section>


            <!-- =========================
                 DRAWN TILE
            ========================== -->
            <section class="draw-section">

                <div class="section-title">
                    <span>DRAWN TILE</span>
                </div>

                <div id="drawn-tile" class="drawn-tile-container"></div>

            </section>


            <!-- =========================
                 ACTION BUTTONS
            ========================== -->
            <section class="action-section">

                <button id="discard-button" class="action-button discard-button">
                    타패
                </button>

                <button id="kan-button" class="action-button kan-button hidden">
                    깡
                </button>

                <button id="win-button" class="action-button win-button hidden">
                    화료
                </button>

                <button id="discard-history-button" class="action-button discard-history-button">
                    버림패 확인
                </button>

            </section>

        </main>


        <!-- =========================
             FOOTER
        ========================== -->
        <footer class="game-footer">

            <div class="deck-info">
                <span>WALL</span>
                <span id="wall-count">133</span>
            </div>

            <div class="wild-info">

                <span>WILD</span>

                <div id="wild-count" class="wild-cards">

                    <!-- 남은 와일드패 개수에 따라 JS가 채움 -->

                </div>

            </div>

        </footer>

    </div>


    <!-- =========================
         DISCARD HISTORY OVERLAY
         (버림패 확인)
    ========================== -->

    <div id="discard-history-overlay" class="discard-overlay hidden">

        <div class="discard-modal">

            <div class="discard-modal-header">

                <span>버려진 패 (<span id="discard-history-count">0</span>장)</span>

                <button id="close-discard-history" class="close-button">
                    ✕
                </button>

            </div>

            <div id="discard-history-tiles" class="discard-tiles">

                <!-- JS가 정렬된 버림패를 채움 -->

            </div>

        </div>

    </div>


    <!-- =========================
         RESULT OVERLAY
         (화료 / 게임 종료 시 표시)
    ========================== -->

    <div id="result-overlay" class="result-overlay hidden">

        <div class="result-modal">

            <div id="result-title" class="result-title"></div>

            <div id="result-message" class="result-message"></div>

            <div id="result-score" class="result-score"></div>

            <button id="restart-button" class="action-button restart-button">
                다시 시작
            </button>

        </div>

    </div>


    <!--
        나중에 JavaScript를 연결할 위치
    -->
     <script src="script.js"></script>

</body>
</html>
